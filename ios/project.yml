name: RunningHealth
options:
  bundleIdPrefix: ai.devin.running
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    SWIFT_STRICT_CONCURRENCY: targeted
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1,2"

targets:
  RunningHealth:
    type: application
    platform: iOS
    sources:
      - path: RunningHealth
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.devin.running.RunningHealth
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: RunningHealth/Info.plist
        CODE_SIGN_ENTITLEMENTS: RunningHealth/RunningHealth.entitlements
    dependencies:
      - sdk: HealthKit.framework
      - sdk: CoreLocation.framework

  RunningHealthTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: RunningHealthTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.devin.running.RunningHealthTests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: RunningHealth

schemes:
  RunningHealth:
    build:
      targets:
        RunningHealth: all
        RunningHealthTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - RunningHealthTests
